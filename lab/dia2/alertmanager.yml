global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "default"
    # Sem integração externa configurada neste lab.
    # Para envio real de e-mail, preencha smtp_smarthost etc.
    webhook_configs:
      - url: "http://alertmanager-sink:5001/"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance"]
