apiVersion: 1

groups:
  - orgId: 1
    name: regras_padrao
    folder: Laboratório
    interval: 1m
    rules:
      - uid: cpu-alta-grafana
        title: CPU alta no host
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              instant: true
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "CPU acima de 80% em {{ $labels.instance }}"
        labels:
          severidade: warning
        isPaused: false
