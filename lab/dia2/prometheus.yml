global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: "docker-host-local"
          environment: "docker"
          cluster: "local-dev"

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          environment: "docker-containers"

  - job_name: "proxmox-pve"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: "pve-homelab-01"
          node: "pve-primary"
          environment: "proxmox"
          cluster: "homelab-fabiosilva"

  - job_name: "kubernetes-nodes"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: "k8s-control-plane-01"
          node: "k8s-master"
          environment: "kubernetes"
          cluster: "pmdf-k8s-cluster"

  - job_name: "mikatos-remoteaccess"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: "mikatos-srv-guacamole"
          service: "remoteaccess-nginx"
          environment: "mikatos-prod"
          customer: "Mikatos"
