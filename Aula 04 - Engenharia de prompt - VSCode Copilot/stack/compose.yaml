services:
  grafana:
    image: grafana/grafana:11.3.0
    container_name: lab-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - obs-network
    depends_on:
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: lab-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=24h'
      - '--web.enable-lifecycle'
    networks:
      - obs-network

  loki:
    image: grafana/loki:3.2.0
    container_name: lab-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-storage:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - obs-network

  alloy:
    image: grafana/alloy:v1.4.3
    container_name: lab-alloy
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - app-logs:/var/log/app:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    networks:
      - obs-network
    depends_on:
      - loki

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: lab-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-storage:/alertmanager
    command: --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    networks:
      - obs-network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: lab-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - obs-network

  app-demo:
    build:
      context: ../app-demo
    image: ecommerce-demo:latest
    container_name: lab-app-demo
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - app-logs:/var/log/app
    networks:
      - obs-network

  notification-receiver:
    build:
      context: ../notification-receiver
    image: notification-receiver:latest
    container_name: lab-notification-receiver
    restart: unless-stopped
    ports:
      - "8088:8088"
    networks:
      - obs-network

networks:
  obs-network:
    name: lab-obs-net
    driver: bridge

volumes:
  grafana-storage:
  prometheus-storage:
  loki-storage:
  alertmanager-storage:
  app-logs:
